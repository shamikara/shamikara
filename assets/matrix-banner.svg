<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hasaru Shamikara — Spandha Labs</title>
  <desc id="desc">A dark, restrained Matrix-inspired code-rain banner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#06160f"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .rain { font: 16px 'Courier New', monospace; fill: #22c55e; opacity: .27; white-space: pre; }
      .dim { opacity: .13; }
      .bright { fill: #bbf7d0; opacity: .72; filter: url(#soft-glow); }
      .fall-a { animation: fall 8s linear infinite; }
      .fall-b { animation: fall 11s linear infinite -4s; }
      .fall-c { animation: fall 13s linear infinite -9s; }
      .fall-d { animation: fall 9s linear infinite -6s; }
      .fall-e { animation: fall 12s linear infinite -2s; }
      @keyframes fall { from { transform: translateY(-170px); } to { transform: translateY(340px); } }
      .title { font: 600 38px Inter, Arial, sans-serif; letter-spacing: 1px; fill: #f8fafc; }
      .subtitle { font: 14px Inter, Arial, sans-serif; letter-spacing: 4px; fill: #86efac; }
      @media (prefers-reduced-motion: reduce) { .fall-a,.fall-b,.fall-c,.fall-d,.fall-e { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#background)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g class="rain">
    <text x="52" y="0" class="fall-a">01&#10;λ&#10;0x&#10;S&#10;8&#10;∴&#10;AI&#10;1&#10;0&#10;∷&#10;L</text>
    <text x="132" y="0" class="fall-c dim">SP&#10;0&#10;1&#10;∆&#10;7&#10;0&#10;N&#10;1&#10;0&#10;·&#10;5</text>
    <text x="224" y="0" class="fall-b">1&#10;0&#10;∴&#10;P&#10;9&#10;01&#10;L&#10;0&#10;↗&#10;8</text>
    <text x="324" y="0" class="fall-d dim">0&#10;Σ&#10;1&#10;0&#10;A&#10;6&#10;∷&#10;1&#10;0&#10;X</text>
    <text x="422" y="0" class="fall-e">01&#10;S&#10;0&#10;P&#10;1&#10;∆&#10;0&#10;N&#10;7&#10;1</text>
    <text x="778" y="0" class="fall-b">0&#10;1&#10;λ&#10;L&#10;0&#10;9&#10;∴&#10;1&#10;0&#10;S</text>
    <text x="864" y="0" class="fall-d dim">A&#10;1&#10;0&#10;∷&#10;8&#10;P&#10;0&#10;1&#10;N</text>
    <text x="948" y="0" class="fall-a">1&#10;0&#10;S&#10;∆&#10;1&#10;0&#10;L&#10;7&#10;∴&#10;0</text>
    <text x="1042" y="0" class="fall-e dim">0&#10;1&#10;P&#10;6&#10;∷&#10;0&#10;A&#10;1&#10;X</text>
    <text x="1132" y="0" class="fall-c">N&#10;0&#10;1&#10;λ&#10;9&#10;0&#10;S&#10;1&#10;∴</text>
  </g>
  <g class="rain bright">
    <text x="224" y="14" class="fall-b">●</text>
    <text x="778" y="22" class="fall-b">●</text>
    <text x="948" y="8" class="fall-a">●</text>
  </g>
  <rect x="304" y="96" width="592" height="108" rx="4" fill="#020617" fill-opacity=".68" stroke="#22c55e" stroke-opacity=".22"/>
  <text x="600" y="141" class="title" text-anchor="middle">HASARU SHAMIKARA</text>
  <text x="600" y="171" class="subtitle" text-anchor="middle">SPANDHA LABS · PRODUCT ENGINEERING</text>
</svg>
